name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA per our own doctrine (v4.2.2). Verify/refresh via Renovate or Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Node >= 20 is preinstalled on ubuntu-latest runners; the script has zero dependencies.
      - run: node scripts/check-skill.mjs
