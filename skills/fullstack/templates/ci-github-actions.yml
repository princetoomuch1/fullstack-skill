# Copy to .github/workflows/ci.yml. Hardened per references/devops-deploy.md.
# The checkout SHA below is v4.2.2 written from memory: verify it, and let Renovate
# (helpers:pinGitHubActionDigests) keep it current.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; grant more per job only when needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Node is preinstalled on GitHub-hosted runners; Corepack provides pnpm from package.json "packageManager".
      - run: corepack enable
      # Frozen lockfile and no lifecycle scripts: the CI equivalent of `npm ci --ignore-scripts`.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium
      # To keep traces on failure, add an upload-artifact step pinned by SHA.

# Deploying to a cloud? Use OIDC federation (id-token: write on the deploy job only),
# never long-lived cloud keys in repository secrets. Never use pull_request_target with untrusted code.
